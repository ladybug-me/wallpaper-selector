[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["liixini"]

[workspace.dependencies]
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
profiling = { version = "1.0.18", default-features = false }
tracy-client = { version = "=0.18.4", default-features = false }
tracing-tracy = { version = "=0.11.4", default-features = false }
tracing-chrome = "0.7.2"
dhat = "0.3.3"
tempfile = "3"

[package]
name = "skwd-wall"
version.workspace = true
edition = "2024"
rust-version = "1.93"
license.workspace = true
publish = false
description = "GPU-rendered graphical client for the Skwd wallpaper suite"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu-bare", "advanced", "canvas", "image-without-codecs", "thread-pool", "wayland", "x11"] }
iced_runtime = "0.14"
iced_wgpu = { version = "0.14", default-features = false, features = ["texture-compression-bc"] }
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
image-webp = "0.2"
texpresso = "2.0.2"
libc = "0.2"
futures-channel = "0.3"
fluent = "0.17"
wall-proto = { git = "https://github.com/liixini/skwd-deck.git" }
skwd-config = { git = "https://github.com/liixini/skwd-deck.git" }
skwd-log = { git = "https://github.com/liixini/skwd-deck.git", features = ["facade"] }
skwd-palette = { git = "https://github.com/liixini/skwd-deck.git" }
skwd-lens-proto = { git = "https://github.com/liixini/skwd-lens.git" }
profiling = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }
tracing-chrome = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
dirs = "6.0.0"


[features]
default = []
obs = ["obs-heap", "obs-frames", "obs-trace"]
obs-heap = ["skwd-log/alloc", "skwd-log/alloc-tap", "skwd-log/proc"]
obs-frames = ["dep:profiling"]
obs-trace = ["dep:tracing", "dep:tracing-subscriber"]
obs-tracy = ["obs-frames", "obs-trace", "dep:tracy-client", "dep:tracing-tracy", "tracing-tracy/enable", "profiling/profile-with-tracy", "tracy-client/enable", "tracy-client/ondemand"]
obs-chrome = ["obs-trace", "dep:tracing-chrome"]
obs-dhat = ["dep:dhat"]

[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = { version = "0.19.1", default-features = false }
wayland-client = "0.31"

[patch.crates-io]
iced_layershell = { git = "https://github.com/liixini/skwd-iced-layershell.git" }
iced_wgpu = { git = "https://github.com/liixini/skwd-iced-wgpu.git" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
panic = "unwind"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 1

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
proptest = "1"
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true

[workspace.lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
float_cmp = "allow"
similar_names = "allow"
many_single_char_names = "allow"
case_sensitive_file_extension_comparisons = "allow"

too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

manual_let_else = "deny"
map_unwrap_or = "deny"
